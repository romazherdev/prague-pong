# Fly.io config. Set `app` to your app name after `fly launch --no-deploy`.
app = "prague-pong"
primary_region = "fra"

[build]

[env]
  DATABASE_PATH = "/data/prague-pong.db"
  DEFAULT_CLUB_SLUG = "mladi-veterani"

[[mounts]]
  source = "prague_pong_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
